name: TRACE Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Code Formatting Check (Black)
        run: |
          black --check trace tests

      - name: Linting Check (Ruff)
        run: |
          ruff check trace tests

      - name: Static Type Check (MyPy)
        run: |
          mypy trace

      - name: Run Unit & Integration Tests (PyTest)
        run: |
          pytest --cov=trace --cov-report=xml

      - name: Verify CLI Entrypoint
        run: |
          python -m trace.cli --help