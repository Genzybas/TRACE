[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trace-framework"
version = "0.1.0"
description = "TRACE: A Behaviour-Centric Evaluation Framework for AI-Generated Text"
readme = "README.md"
requires-python = ">=3.12"

license = { text = "MIT" }

authors = [
    { name = "TRACE Research Team GENZY" }
]

keywords = [
    "trace",
    "behaviour",
    "evaluation",
    "nlp",
    "artificial-intelligence",
    "llm",
    "research",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.8",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "typing_extensions>=4.12",
]

[project.optional-dependencies]

dev = [
    "black>=24.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

docs = [
    "mkdocs",
    "mkdocs-material",
]

[tool.black]

line-length = 88
target-version = ["py312"]

[tool.ruff]

line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
]

ignore = [
]

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

disallow_untyped_defs = true

disallow_any_generics = true

no_implicit_optional = true

check_untyped_defs = true

show_error_codes = true

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = [
    "--cov=trace",
    "--cov-report=term-missing",
]

[tool.coverage.run]

branch = true

source = [
    "src/trace",
]

[tool.coverage.report]

show_missing = true
skip_empty = true

[tool.hatch.build.targets.wheel]

packages = [
    "src/trace",
]